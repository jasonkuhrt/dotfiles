gui:
  scrollHeight: 10
  showRootItemInFileTree: false
  # Tokyo Night theme
  # Source: https://github.com/folke/tokyonight.nvim/blob/main/extras/lazygit/tokyonight_night.yml
  theme:
    activeBorderColor:
      - '#7aa2f7' # blue
      - bold
    inactiveBorderColor:
      - '#565f89' # comment
    searchingActiveBorderColor:
      - '#e0af68' # yellow
      - bold
    optionsTextColor:
      - '#7aa2f7' # blue
    selectedLineBgColor:
      - '#283457' # visual selection
    cherryPickedCommitFgColor:
      - '#7aa2f7' # blue
    cherryPickedCommitBgColor:
      - '#bb9af7' # magenta
    markedBaseCommitFgColor:
      - '#7aa2f7' # blue
    markedBaseCommitBgColor:
      - '#e0af68' # yellow
    unstagedChangesColor:
      - '#f7768e' # red
    defaultFgColor:
      - '#c0caf5' # fg
git:
  # Commit messages starting with this prefix are committed with --no-verify
  # (skips pre-commit / commit-msg hooks). Only a single prefix is supported.
  skipHookPrefix: 'rachet'
  # `pagers` is a LIST (see `lazygit --config`).
  # delta reads its own behaviour (navigate, line-numbers, hyperlinks,
  # theme) from ~/.gitconfig's [delta] section; this only names the
  # command. --paging=never stops delta spawning its own less, leaving
  # lazygit in control of scrolling.
  pagers:
    - colorArg: always
      pager: delta --paging=never
os:
  # `o` (openFile) opens in Zed, not the macOS default app. Needed because
  # extensionless files like `Dockerfile` can't be routed by duti.yml (which is
  # extension-keyed): macOS sends `Dockerfile` to VS Code, whose Info.plist
  # declares the `Dockerfile` filename, while Zed declares no Dockerfile type.
  # This forces Zed for every `o` file-open (links still use os.openLink).
  open: 'zed -- {{filename}}'
customCommands:
  - key: 'H'
    context: 'staging'
    description: 'Open Hunk review (working tree)'
    command: hunk diff --watch
    loadingText: 'Opening Hunk working-tree review'
    output: terminal
  - key: 'H'
    context: 'stagingSecondary'
    description: 'Open Hunk review (staged)'
    command: hunk diff --staged
    loadingText: 'Opening Hunk staged review'
    output: terminal
  - key: 'H'
    context: 'files'
    description: 'Open Hunk review (selected path)'
    command: hunk diff --watch -- {{.SelectedPath | quote}}
    loadingText: 'Opening Hunk path review'
    output: terminal
  - key: 'H'
    context: 'commits, subCommits, reflogCommits'
    description: 'Open Hunk review (selected commit)'
    command: hunk show {{.SelectedCommit.Hash | quote}}
    loadingText: 'Opening Hunk commit review'
    output: terminal
